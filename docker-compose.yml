# The web app joins the network the API owns, per golden rule 5.
# Bring the API stack up first.

name: trident-web

# Docker's default json-file driver has no limit at all, so a container that logs
# steadily fills the disk of the machine the party is happening on.
x-logging: &rotated-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    restart: unless-stopped
    logging: *rotated-logs
    # Next serves a standalone build: one process, no bundler, no watcher.
    mem_limit: 512m
    build:
      context: .
      args:
        # Must match REVERB_APP_KEY on the API side.
        NEXT_PUBLIC_REVERB_APP_KEY: ${NEXT_PUBLIC_REVERB_APP_KEY:-trident-local}
        # Inlined at build time like every NEXT_PUBLIC_ value, so it belongs here
        # and not under `environment:` — set there it would change nothing and
        # read as though it did.
        NEXT_PUBLIC_TRIDENT_RECONCILE_POLL_MS: ${NEXT_PUBLIC_TRIDENT_RECONCILE_POLL_MS:-}
    environment:
      # Server-side only, never prefixed with NEXT_PUBLIC_: the browser talks to
      # this app's own BFF, and the BFF talks to Laravel by container name.
      BACKEND_API_URL: http://api:8000/api/v1
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks: [trident-net]

networks:
  trident-net:
    name: trident-net
    external: true
